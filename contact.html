
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contactez-moi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark">
  <header>
    <nav>
      <div class="nav-left">
        <a href="index.html">Présentation</a>
        <a href="projets.html">Projets</a>
        <a href="contact.html">Contact</a>
      </div>
      <button id="theme-toggle">🌙</button>
    </nav>
  </header>

  <main class="content">
    <section class="contact">
      <h1>Contactez-moi</h1>
      <p>Si vous avez des questions ou souhaitez discuter d'une opportunité, n'hésitez pas à m'envoyer un message en remplissant le formulaire ci-dessous :</p>
      
      <form action="mailto:votre-email@example.com" method="post" enctype="text/plain">
        <label for="name">Nom :</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email :</label>
        <input type="email" id="email" name="email" required />

        <label for="message">Message :</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <button type="submit">Envoyer</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
